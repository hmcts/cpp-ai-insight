name: Publish

# Builds the package on every PR. A published GitHub Release also uploads the wheel to
# the hmcts-lib Azure Artifacts feed as a Maven artefact,
# uk.gov.hmcts.cp:hmcts-cpp-ai-insight:<version> (type whl). Artifactory proxies that
# feed's Maven side only (remote repository dtspublicazureartifacts), not its PyPI side,
# so the Docker image build in cpp-docker-images downloads the wheel from there.
# The version is the release tag: v1.0.0 publishes 1.0.0.

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

env:
  # Matches the Docker image (python:3.11-slim).
  PYTHON_VERSION: "3.11"
  GROUP_ID: uk.gov.hmcts.cp
  ARTIFACT_ID: hmcts-cpp-ai-insight

jobs:
  package:
    name: Build and publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          twine check --strict dist/*
          if [[ "${{ github.event_name }}" == "release" ]]; then
            ls "dist/hmcts_cpp_ai_insight-${TAG#v}-py3-none-any.whl"
          fi
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import app.main"

      - name: Upload build artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish the wheel to the hmcts-lib feed
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          FEED_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          FEED_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
        run: |
          version="${TAG#v}"
          wheel="dist/hmcts_cpp_ai_insight-${version}-py3-none-any.whl"
          # Credentials are read from the environment, so they never appear on a command line.
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>hmcts-lib</id>
                <username>${env.FEED_USERNAME}</username>
                <password>${env.FEED_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          mvn --batch-mode --no-transfer-progress --settings "$RUNNER_TEMP/settings.xml" \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile="$wheel" -DgroupId="$GROUP_ID" -DartifactId="$ARTIFACT_ID" \
            -Dversion="$version" -Dpackaging=whl -DgeneratePom=true \
            -DrepositoryId=hmcts-lib \
            -Durl=https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1
          echo "Published $GROUP_ID:$ARTIFACT_ID:$version" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 (for the cpp-docker-images Dockerfile): $(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
