name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the Docker image (python:3.11-slim).
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests and pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Run tests
        run: python -m pytest --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t cpp-ai-insight:ci .

      - name: Start container
        run: |
          docker run -d --name cpp-ai-insight -p 4550:4550 cpp-ai-insight:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4550/ > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for the service ($i)..."
            sleep 2
          done
          docker logs cpp-ai-insight
          exit 1

      - name: Smoke test endpoints
        run: ./scripts/smoke-test.sh http://localhost:4550

      - name: Container logs
        if: always()
        run: docker logs cpp-ai-insight || true
